[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-harness"
version = "0.1.0a56"
description = "Agent-mediated backlog dispatch and integration harness"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.160.0",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
agentic-harness = "backlog_harness.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.coverage.run]
branch = true
source_pkgs = ["backlog_harness"]
patch = ["subprocess"]
parallel = true

[tool.coverage.paths]
source = ["src/backlog_harness", "*/site-packages/backlog_harness"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2
exclude_lines = []
